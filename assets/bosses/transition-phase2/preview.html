<!doctype html><meta charset="utf-8"><title>보스 전환 미리보기</title>
<style>body{background:#263e42;color:white;font:16px system-ui;text-align:center}canvas{background:repeating-conic-gradient(#33474a 0% 25%,#3a5154 0% 50%) 0/32px 32px;max-width:95vw}button,select{font:inherit;margin:12px;padding:8px}</style>
<h1>보스 전환 미리보기</h1><select id="boss"></select><button id="play">다시 재생</button><p id="info">불러오는 중</p><canvas width="600" height="600"></canvas>
<script src="frames.js"></script><script>
const names=['steel-factory','auto-factory','chemical-factory','executioner','central-ai'];
const labels=['철강공장','자동차공장','화학공장','집행자','중앙 AI'];
const sel=document.querySelector('select'),ctx=document.querySelector('canvas').getContext('2d');
let image,frames=[],start=0,token=0;
names.forEach((n,i)=>sel.add(new Option(labels[i],n)));
function load(){
  const own=++token,im=new Image();frames=[];image=null;
  im.onload=()=>{
    if(own!==token)return;
    frames=TRANSITION_FRAMES[sel.value].frames;image=im;start=performance.now();
  };
  im.onerror=()=>document.querySelector('#info').textContent='이미지를 불러오지 못했습니다';
  im.src=sel.value+'.png';
}
sel.onchange=load;document.querySelector('button').onclick=()=>start=performance.now();
function draw(now){
  ctx.clearRect(0,0,600,600);
  if(image){
    const f=frames[Math.min(5,Math.floor((now-start)/150))],scale=460/Math.max(image.width/3,image.height/2);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(image,f.sx,f.sy,f.sw,f.sh,300-f.cx*scale,300-f.cy*scale,f.sw*scale,f.sh*scale);
  }
  requestAnimationFrame(draw);
}
load();requestAnimationFrame(draw);
</script>
